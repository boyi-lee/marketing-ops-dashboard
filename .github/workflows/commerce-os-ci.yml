name: Commerce OS isolated quality gate
on:
  pull_request:
    paths:
      - 'commerce-planning-os/**'
      - '.github/workflows/commerce-os-ci.yml'
  push:
    branches:
      - 'feat/commerce-planning-os-p0'
    paths:
      - 'commerce-planning-os/**'
      - '.github/workflows/commerce-os-ci.yml'
jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: commerce_test
          POSTGRES_PASSWORD: commerce_test_only
          POSTGRES_DB: commerce_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commerce_test -d commerce_os_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      COMMERCE_TEST_PG_DSN: postgresql://commerce_test:commerce_test_only@127.0.0.1:5432/commerce_os_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PostgreSQL test client
        run: python -m pip install 'psycopg[binary]>=3.1,<4'
      - name: Run unit, contract and real PostgreSQL integration tests
        run: cd commerce-planning-os && python -m unittest discover -s tests -v
      - name: Deny known Shopify writes and token patterns
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('commerce-planning-os')
          src='\n'.join(x.read_text() for x in (p/'src').rglob('*.py'))
          for word in ['productUpdate(', 'inventoryAdjustQuantities(', 'orderEditBegin(', 'shpat_', 'mutation {']:
              assert word not in src, word
          print('Denylist passed; separate security audit still required')
          PY
